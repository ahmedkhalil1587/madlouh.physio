<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>نظام العلاج الطبيعي - مجمع المدلوح الطبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --purple:#3b1f6e;
  --purple-dark:#28154d;
  --gold:#b9a227;
  --gold-light:#e6d97a;
  --bg:#f6f5fa;
  --card:#ffffff;
  --ink:#231b3a;
  --muted:#736c8a;
  --line:#e6e2f2;
  --danger:#c0392b;
  --success:#1e8a5f;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Cairo','Inter',sans-serif;
  min-height:100vh;
}
body.lang-en{font-family:'Inter','Cairo',sans-serif;}
.app-shell{max-width:1180px;margin:0 auto;padding:18px 16px 60px;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,var(--purple) 0%,var(--purple-dark) 100%);
  border-radius:var(--radius);
  padding:14px 20px;
  color:#fff;
  margin-bottom:20px;
  box-shadow:0 6px 20px rgba(59,31,110,.18);
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-dot{
  width:38px;height:38px;border-radius:10px;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;padding:2px;
}
.brand-dot img{width:100%;height:100%;object-fit:contain;display:block;}
.brand-text .t1{font-weight:800;font-size:15px;line-height:1.3;}
.brand-text .t2{font-size:11.5px;color:var(--gold-light);}
.top-actions{display:flex;align-items:center;gap:10px;}
.pill{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.25);
  color:#fff;padding:7px 12px;border-radius:20px;font-size:12.5px;
  cursor:pointer;user-select:none;
}
.pill:hover{background:rgba(255,255,255,.22);}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 2px 10px rgba(59,31,110,.05);
}
h1,h2,h3{margin:0 0 6px;color:var(--purple-dark);}
h2{font-size:19px;}
h3{font-size:15.5px;}
.muted{color:var(--muted);font-size:13px;}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:var(--purple-dark);}
input[type=text],input[type=password],input[type=tel],input[type=date],input[type=time],select,textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
  font-family:inherit;font-size:14px;background:#fff;color:var(--ink);
  transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);}
textarea{resize:vertical;min-height:70px;}
.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
@media(max-width:720px){.grid-2,.grid-3{grid-template-columns:1fr;}}
.field{margin-bottom:2px;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:10px;border:none;cursor:pointer;
  font-family:inherit;font-weight:700;font-size:14px;transition:transform .05s,opacity .15s;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--purple);color:#fff;}
.btn-primary:hover{background:var(--purple-dark);}
.btn-gold{background:var(--gold);color:var(--purple-dark);}
.btn-gold:hover{opacity:.9;}
.btn-outline{background:#fff;border:1.5px solid var(--purple);color:var(--purple);}
.btn-outline:hover{background:#f1eefb;}
.btn-danger{background:#fdecea;color:var(--danger);}
.btn-danger:hover{background:#fadbd8;}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.tab{
  padding:9px 16px;border-radius:10px;background:#fff;border:1.5px solid var(--line);
  cursor:pointer;font-weight:700;font-size:13.5px;color:var(--muted);
}
.tab.active{background:var(--purple);color:#fff;border-color:var(--purple);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:start;}
th{background:#f3f0fb;color:var(--purple-dark);font-weight:700;}
tr:hover td{background:#faf9fd;}
.badge{padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
.badge-pending{background:#fff3cd;color:#8a6d00;}
.badge-approved{background:#dcf5e8;color:var(--success);}
.badge-admin{background:#eee2ff;color:var(--purple);}
.badge-user{background:#eef0ff;color:#33409b;}
.msg{padding:11px 14px;border-radius:10px;font-size:13.5px;margin-bottom:14px;}
.msg-error{background:#fdecea;color:var(--danger);border:1px solid #f6cbc6;}
.msg-success{background:#e7f8ef;color:var(--success);border:1px solid #b9e8cf;}
.msg-info{background:#eef0fb;color:var(--purple);border:1px solid #d8d3f5;}
.center{text-align:center;}
.login-wrap{max-width:420px;margin:60px auto 0;}
.logo-big{width:86px;height:86px;margin:0 auto 14px;display:block;}
.session-row{display:grid;grid-template-columns:36px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px;}
.session-num{
  width:30px;height:30px;border-radius:50%;background:var(--purple);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
}
canvas.sigpad{
  border:1.5px dashed var(--line);border-radius:10px;width:100%;height:150px;
  touch-action:none;background:#fff;
}
.link-btn{background:none;border:none;color:var(--purple);text-decoration:underline;cursor:pointer;font-family:inherit;font-size:13px;padding:0;}
.spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:40px 20px;color:var(--muted);}
/* ---- Card (printable treatment card) ---- */
.pt-card{
  width:900px;max-width:100%;background:#fff;border-radius:16px;overflow:hidden;
  border:1px solid var(--line);margin:0 auto;
}
.pt-card-head{
  background:linear-gradient(135deg,var(--purple) 0%,var(--purple-dark) 100%);
  color:#fff;padding:20px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.pt-card-head .logo-mark{
  width:52px;height:52px;border-radius:12px;background:#fff;
  flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:3px;
}
.pt-card-head .logo-mark img{width:100%;height:100%;object-fit:contain;display:block;}
.pt-card-head h2{color:#fff;margin:0;font-size:18px;}
.pt-card-head .sub{color:var(--gold-light);font-size:12px;margin-top:2px;}
.pt-card-body{padding:22px 26px;}
.pt-info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 20px;margin-bottom:18px;}
.pt-info-grid .it .k{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.pt-info-grid .it .v{font-size:14px;font-weight:700;color:var(--ink);}
.pt-card-body table{margin-bottom:16px;}
.pt-card-body th{font-size:11.5px;}
.pt-sig-box{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-top:10px;}
.pt-sig-box .sig-img{border-bottom:1.5px solid var(--ink);height:70px;display:flex;align-items:flex-end;justify-content:center;min-width:220px;}
.pt-sig-box .sig-img img{max-height:65px;}
.pt-sig-label{font-size:11.5px;color:var(--muted);margin-top:4px;text-align:center;}
.pt-card-foot{
  background:#f3f0fb;padding:12px 26px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;
  font-size:11.5px;color:var(--purple-dark);font-weight:600;
}
.status-done{color:var(--success);font-weight:700;}
.status-pending{color:#b3860b;font-weight:700;}
.status-empty{color:#bbb;}
::placeholder{color:#b8b3cc;}
</style>
</head>

function persistUrlState(){
  const p = new URLSearchParams();
  if(STATE.apiUrl) p.set('api', encodeURIComponent(STATE.apiUrl));
  if(STATE.lang !== 'ar') p.set('lang', STATE.lang);
  const newUrl = location.pathname + (p.toString() ? '?' + p.toString() : '');
  history.replaceState(null, '', newUrl);
}

/* ======================= API HELPER ======================= */
async function api(action, params, method){
  method = method || 'GET';
  if(!STATE.apiUrl) throw new Error('no api url');
  if(method === 'GET'){
    const url = new URL(STATE.apiUrl);
    url.searchParams.set('action', action);
    Object.keys(params||{}).forEach(k => { if(params[k]!==undefined && params[k]!==null) url.searchParams.set(k, params[k]); });
    const res = await fetch(url.toString(), {method:'GET'});
    return res.json();
  } else {
    const body = Object.assign({action}, params||{});
    const res = await fetch(STATE.apiUrl, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(body)
    });
    return res.json();
  }
}

function render(){
  document.documentElement.lang = STATE.lang;
  document.documentElement.dir = t().dir;
  document.body.className = STATE.lang === 'en' ? 'lang-en' : '';
  const app = document.getElementById('app');
  let html = '';
  if(STATE.view === 'setup') html = renderSetup();
  else if(STATE.view === 'login') html = renderTopbar() + renderLogin();
  else if(STATE.view === 'register') html = renderTopbar() + renderRegister();
  else if(STATE.view === 'admin' || STATE.view === 'user') html = renderTopbar() + renderDashboard();
  app.innerHTML = html;
  bindEvents();
}

  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ======================= SIGNATURE PAD ======================= */
let sigCtx = null, sigDrawing = false, sigLast = null;
function initSigPad(){
  const canvas = document.getElementById('sigPad');
  if(!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * ratio;
  canvas.height = canvas.clientHeight * ratio;
  sigCtx = canvas.getContext('2d');
  sigCtx.scale(ratio, ratio);
  sigCtx.strokeStyle = '#231b3a';
  sigCtx.lineWidth = 2.2;
  sigCtx.lineCap = 'round';

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return {x: cx, y: cy};
  }
  function start(e){ e.preventDefault(); sigDrawing = true; sigLast = pos(e); }
  function move(e){
    if(!sigDrawing) return;
    e.preventDefault();
    const p = pos(e);
    sigCtx.beginPath();
    sigCtx.moveTo(sigLast.x, sigLast.y);
    sigCtx.lineTo(p.x, p.y);
    sigCtx.stroke();
    sigLast = p;
    STATE.sigDrawn = true;
  }
  function end(){ sigDrawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}
function clearSigPad(){
  const canvas = document.getElementById('sigPad');
  if(!canvas || !sigCtx) return;
  sigCtx.clearRect(0,0,canvas.width,canvas.height);
  STATE.sigDrawn = false;
}
function getSigDataUrl(){
  const canvas = document.getElementById('sigPad');
  if(!canvas || !STATE.sigDrawn) return '';
  return canvas.toDataURL('image/png');
}

/* ======================= CARD CANVAS RENDERER (native, correct Arabic shaping) ======================= */
function loadImage(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
// Truncates text with an ellipsis so it fits maxWidth. Uses native fillText/measureText,
// so Arabic joining/shaping is handled correctly by the browser (unlike html2canvas).
function truncateToWidth(ctx, text, maxWidth){
  text = String(text == null ? '' : text);
  if(ctx.measureText(text).width <= maxWidth) return text;
  let lo = 0, hi = text.length;
  while(lo < hi){
    const mid = Math.ceil((lo+hi)/2);
    const candidate = text.slice(0, mid) + '…';
    if(ctx.measureText(candidate).width <= maxWidth) lo = mid; else hi = mid - 1;
  }
  return text.slice(0, lo) + '…';
}
function formatSessionValue(val){
  if(!val) return '';
  // "YYYY-MM-DD HH:MM" -> keep as-is; already human readable and LTR-safe inside RTL context
  return String(val);
}
function isPastSession(val){
  if(!val) return false;
  const d = new Date(String(val).replace(' ', 'T'));
  if(isNaN(d)) return false;
  return d < new Date();
}

async function renderCardToCanvas(patient){
  const L = t(); const c = cfg();
  const isAr = STATE.lang === 'ar';
  const scale = 2;
  const W = 900;
  const PAD = 26;
  const HEADER_H = 108;
  const ROW_H = 44;
  const INFO_ROWS = 3, INFO_COLS = 3;
  const INFO_GRID_H = INFO_ROWS * ROW_H + 6;
  const TABLE_HEADER_H = 32;
  const TABLE_ROW_H = 30;
  const TABLE_H = TABLE_HEADER_H + 12 * TABLE_ROW_H;
  const SIG_H = 118;
  const FOOTER_H = 50;
  const bodyTop = HEADER_H + PAD;
  const infoGridTop = bodyTop;
  const tableTop = infoGridTop + INFO_GRID_H + 18;
  const sigTop = tableTop + TABLE_H + 18;
  const H = sigTop + SIG_H + PAD + FOOTER_H;

  const canvas = document.createElement('canvas');
  canvas.width = Math.ceil(W * scale);
  canvas.height = Math.ceil(H * scale);
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.direction = isAr ? 'rtl' : 'ltr';
  ctx.textBaseline = 'alphabetic';

  const COL = {
    purple: '#3b1f6e', purpleDark: '#28154d', gold: '#b9a227', goldLight: '#e6d97a',
    ink: '#231b3a', muted: '#736c8a', line: '#e6e2f2', footBg: '#f3f0fb',
    success: '#1e8a5f', pending: '#b3860b', empty: '#bbbbbb'
  };
  const FONT = "'Cairo','Tahoma',sans-serif";

  try{ if(document.fonts && document.fonts.ready) await document.fonts.ready; }catch(e){}

  // ---- background ----
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  // ---- header ----
  const grad = ctx.createLinearGradient(0, 0, W, HEADER_H);
  grad.addColorStop(0, COL.purple);
  grad.addColorStop(1, COL.purpleDark);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, HEADER_H);

  const logoSize = 54;
  const logoX = isAr ? PAD : (W - PAD - logoSize);
  const logoY = (HEADER_H - logoSize) / 2;
  roundRectPath(ctx, logoX, logoY, logoSize, logoSize, 12);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  try{
    const logoImg = await loadImage(LOGO_ICON);
    ctx.drawImage(logoImg, logoX + 5, logoY + 5, logoSize - 10, logoSize - 10);
  }catch(e){}

  const clinicName = isAr ? (c.clinicNameAr || '') : (c.clinicNameEn || '');
  ctx.fillStyle = '#ffffff';
  ctx.font = "700 19px " + FONT;
  ctx.textAlign = isAr ? 'right' : 'left';
  const textEdgeX = isAr ? (W - PAD) : PAD;
  ctx.fillText(truncateToWidth(ctx, clinicName, W - PAD*2 - logoSize - 20), textEdgeX, HEADER_H/2 - 4);
  ctx.fillStyle = COL.goldLight;
  ctx.font = "600 12.5px " + FONT;
  ctx.fillText(L.patientCard, textEdgeX, HEADER_H/2 + 18);

  // ---- info grid ----
  const items = [
    [L.patientName, patient.PatientName],
    [L.fileNumber, patient.FileNumber],
    [L.insuranceCompany, patient.InsuranceCompany || '-'],
    [L.nationalId, patient.NationalID || '-'],
    [L.mobile, patient.Mobile || '-'],
    [L.doctor, patient.Doctor || '-'],
    [L.nurseName, patient.NurseName || '-'],
    [L.regDate, patient.RegistrationDate || '-'],
    [L.treatment, patient.Treatment || '-']
  ];
  const colW = (W - PAD*2) / INFO_COLS;
  const cellInnerPad = 4;
  for(let idx = 0; idx < items.length; idx++){
    const rowIdx = Math.floor(idx / INFO_COLS);
    const dataCol = idx % INFO_COLS;
    const physCol = isAr ? (INFO_COLS - 1 - dataCol) : dataCol;
    const colLeft = PAD + physCol * colW;
    const rowTop = infoGridTop + rowIdx * ROW_H;
    const align = isAr ? 'right' : 'left';
    const anchorX = isAr ? (colLeft + colW - cellInnerPad) : (colLeft + cellInnerPad);
    ctx.textAlign = align;
    ctx.fillStyle = COL.muted;
    ctx.font = "700 10.5px " + FONT;
    ctx.fillText(truncateToWidth(ctx, items[idx][0], colW - cellInnerPad*2), anchorX, rowTop + 13);
    ctx.fillStyle = COL.ink;
    ctx.font = "700 14px " + FONT;
    ctx.fillText(truncateToWidth(ctx, items[idx][1], colW - cellInnerPad*2), anchorX, rowTop + 32);
  }

  // ---- sessions table ----
  const SESS_W = 70, STATUS_W = 110;
  const DATE_W = (W - PAD*2) - SESS_W - STATUS_W;
  // physical left-to-right order
  let colsPhys; // [{key,width}]
  if(isAr){
    colsPhys = [{key:'status', w:STATUS_W}, {key:'date', w:DATE_W}, {key:'session', w:SESS_W}];
  } else {
    colsPhys = [{key:'session', w:SESS_W}, {key:'date', w:DATE_W}, {key:'status', w:STATUS_W}];
  }
  const colX = [];
  { let x = PAD; for(const col of colsPhys){ colX.push(x); x += col.w; } }

  // table header row
  ctx.fillStyle = COL.footBg;
  ctx.fillRect(PAD, tableTop, W - PAD*2, TABLE_HEADER_H);
  ctx.font = "700 11.5px " + FONT;
  ctx.fillStyle = COL.purpleDark;
  const headerLabel = { session: L.session, date: L.date + ' / ' + L.time, status: L.status };
  colsPhys.forEach((col, i) => {
    ctx.textAlign = 'center';
    ctx.fillText(truncateToWidth(ctx, headerLabel[col.key], col.w - 10), colX[i] + col.w/2, tableTop + 21);
  });

  // table rows
  for(let s = 1; s <= 12; s++){
    const rowY = tableTop + TABLE_HEADER_H + (s-1) * TABLE_ROW_H;
    // bottom border
    ctx.strokeStyle = COL.line;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(PAD, rowY + TABLE_ROW_H);
    ctx.lineTo(W - PAD, rowY + TABLE_ROW_H);
    ctx.stroke();

    const rawVal = patient['Session' + s] || '';
    const val = formatSessionValue(rawVal);
    const textY = rowY + TABLE_ROW_H/2 + 4;

    colsPhys.forEach((col, i) => {
      ctx.textAlign = 'center';
      const cx = colX[i] + col.w/2;
      if(col.key === 'session'){
        ctx.fillStyle = COL.ink;
        ctx.font = "700 12.5px " + FONT;
        ctx.fillText(String(s), cx, textY);
      } else if(col.key === 'date'){
        ctx.fillStyle = val ? COL.ink : COL.empty;
        ctx.font = "400 12px " + FONT;
        ctx.fillText(truncateToWidth(ctx, val || '-', col.w - 12), cx, textY);
      } else if(col.key === 'status'){
        if(!val){
          ctx.fillStyle = COL.empty;
          ctx.font = "400 11.5px " + FONT;
          ctx.fillText(truncateToWidth(ctx, L.notScheduled, col.w - 10), cx, textY);
        } else if(isPastSession(rawVal)){
          ctx.fillStyle = COL.success;
          ctx.font = "700 14px " + FONT;
          ctx.fillText('✓', cx, textY);
        } else {
          ctx.fillStyle = COL.pending;
          ctx.font = "700 16px " + FONT;
          ctx.fillText('•', cx, textY);
        }
      }
    });
  }

  // ---- signature ----
  const sigBoxW = 260;
  const sigBoxX = isAr ? (W - PAD - sigBoxW) : PAD;
  const sigLineY = sigTop + 78;
  if(patient.SignatureDataURL){
    try{
      const sigImg = await loadImage(patient.SignatureDataURL);
      const maxH = 70, maxW = sigBoxW - 10;
      let dw = sigImg.width, dh = sigImg.height;
      const ratio = Math.min(maxW/dw, maxH/dh);
      dw *= ratio; dh *= ratio;
      ctx.drawImage(sigImg, sigBoxX + (sigBoxW-dw)/2, sigLineY - dh, dw, dh);
    }catch(e){}
  }
  ctx.strokeStyle = COL.ink;
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(sigBoxX, sigLineY);
  ctx.lineTo(sigBoxX + sigBoxW, sigLineY);
  ctx.stroke();
  ctx.fillStyle = COL.muted;
  ctx.font = "600 11.5px " + FONT;
  ctx.textAlign = 'center';
  ctx.fillText(L.signature, sigBoxX + sigBoxW/2, sigLineY + 18);

  // ---- footer ----
  const footTop = H - FOOTER_H;
  ctx.fillStyle = COL.footBg;
  ctx.fillRect(0, footTop, W, FOOTER_H);
  ctx.font = "700 11.5px " + FONT;
  ctx.fillStyle = COL.purpleDark;
  const addressTxt = L.address + ': ' + (c.address || '');
  const phoneTxt = L.phone + ': ' + (c.phone || '');
  if(isAr){
    ctx.textAlign = 'right';
    ctx.fillText(truncateToWidth(ctx, addressTxt, W/2 - PAD - 10), W - PAD, footTop + FOOTER_H/2 + 4);
    ctx.textAlign = 'left';
    ctx.fillText(truncateToWidth(ctx, phoneTxt, W/2 - PAD - 10), PAD, footTop + FOOTER_H/2 + 4);
  } else {
    ctx.textAlign = 'left';
    ctx.fillText(truncateToWidth(ctx, addressTxt, W/2 - PAD - 10), PAD, footTop + FOOTER_H/2 + 4);
    ctx.textAlign = 'right';
    ctx.fillText(truncateToWidth(ctx, phoneTxt, W/2 - PAD - 10), W - PAD, footTop + FOOTER_H/2 + 4);
  }

  return canvas;
}

async function onDownloadCard(){
  if(!STATE.currentPatient) return;
  const btn = document.getElementById('btnDownloadCard');
  if(btn) btn.disabled = true;
  try{
    const canvas = await renderCardToCanvas(STATE.currentPatient);
    const link = document.createElement('a');
    link.download = 'PT_Card_' + (STATE.currentPatient.FileNumber || 'patient') + '.jpg';
    link.href = canvas.toDataURL('image/jpeg', 0.95);
    link.click();
  } catch(err){
    setMsg('error', t().connError);
    render();
  }
  if(btn) btn.disabled = false;
}

function onPrintCard(){
  const node = document.getElementById('ptCard');
  if(!node) return;
  const w = window.open('', '_blank');
  w.document.write('<html><head><title>Print</title>' + document.querySelector('style').outerHTML + '</head><body style="padding:20px;">' + node.outerHTML + '</body></html>');
  w.document.close();
  setTimeout(() => w.print(), 300);
}

async function onChangePassword(){
  const newPw = document.getElementById('newPw').value;
  if(newPw.length < 6){ setMsg('error', t().requiredFields); render(); return; }
  STATE.loading = true; clearMsg(); render();
  try{
    const res = await api('changePassword', {username: STATE.user.username, newPassword: newPw}, 'POST');
    STATE.loading = false;
    if(res.success) setMsg('success', t().pwChanged); else setMsg('error', res.message);
  } catch(err){ STATE.loading = false; setMsg('error', t().connError); }
  render();
}

/* ======================= INIT ======================= */
(function init(){
  render();
  if(STATE.apiUrl) loadConfigSilently();
})();
</script>
