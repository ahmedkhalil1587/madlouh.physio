<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>نظام العلاج الطبيعي - مجمع المدلوح الطبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --purple:#3b1f6e;
  --purple-dark:#28154d;
  --gold:#b9a227;
  --gold-light:#e6d97a;
  --bg:#f6f5fa;
  --card:#ffffff;
  --ink:#231b3a;
  --muted:#736c8a;
  --line:#e6e2f2;
  --danger:#c0392b;
  --success:#1e8a5f;
  --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Cairo','Inter',sans-serif;
  min-height:100vh;
}
body.lang-en{font-family:'Inter','Cairo',sans-serif;}
.app-shell{max-width:1180px;margin:0 auto;padding:18px 16px 60px;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(135deg,var(--purple) 0%,var(--purple-dark) 100%);
  border-radius:var(--radius);
  padding:14px 20px;
  color:#fff;
  margin-bottom:20px;
  box-shadow:0 6px 20px rgba(59,31,110,.18);
}
.brand{display:flex;align-items:center;gap:12px;}
.brand-dot{
  width:38px;height:38px;border-radius:10px;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;padding:2px;
}
.brand-dot img{width:100%;height:100%;object-fit:contain;display:block;}
.brand-text .t1{font-weight:800;font-size:15px;line-height:1.3;}
.brand-text .t2{font-size:11.5px;color:var(--gold-light);}
.top-actions{display:flex;align-items:center;gap:10px;}
.pill{
  background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.25);
  color:#fff;padding:7px 12px;border-radius:20px;font-size:12.5px;
  cursor:pointer;user-select:none;
}
.pill:hover{background:rgba(255,255,255,.22);}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 2px 10px rgba(59,31,110,.05);
}
h1,h2,h3{margin:0 0 6px;color:var(--purple-dark);}
h2{font-size:19px;}
h3{font-size:15.5px;}
.muted{color:var(--muted);font-size:13px;}
label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:var(--purple-dark);}
input[type=text],input[type=password],input[type=tel],input[type=date],input[type=time],select,textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;
  font-family:inherit;font-size:14px;background:#fff;color:var(--ink);
  transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);}
textarea{resize:vertical;min-height:70px;}
.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:1fr 1fr 1fr;}
@media(max-width:720px){.grid-2,.grid-3{grid-template-columns:1fr;}}
.field{margin-bottom:2px;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:10px;border:none;cursor:pointer;
  font-family:inherit;font-weight:700;font-size:14px;transition:transform .05s,opacity .15s;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--purple);color:#fff;}
.btn-primary:hover{background:var(--purple-dark);}
.btn-gold{background:var(--gold);color:var(--purple-dark);}
.btn-gold:hover{opacity:.9;}
.btn-outline{background:#fff;border:1.5px solid var(--purple);color:var(--purple);}
.btn-outline:hover{background:#f1eefb;}
.btn-danger{background:#fdecea;color:var(--danger);}
.btn-danger:hover{background:#fadbd8;}
.btn-sm{padding:7px 12px;font-size:12.5px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.tab{
  padding:9px 16px;border-radius:10px;background:#fff;border:1.5px solid var(--line);
  cursor:pointer;font-weight:700;font-size:13.5px;color:var(--muted);
}
.tab.active{background:var(--purple);color:#fff;border-color:var(--purple);}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:start;}
th{background:#f3f0fb;color:var(--purple-dark);font-weight:700;}
tr:hover td{background:#faf9fd;}
.badge{padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
.badge-pending{background:#fff3cd;color:#8a6d00;}
.badge-approved{background:#dcf5e8;color:var(--success);}
.badge-admin{background:#eee2ff;color:var(--purple);}
.badge-user{background:#eef0ff;color:#33409b;}
.msg{padding:11px 14px;border-radius:10px;font-size:13.5px;margin-bottom:14px;}
.msg-error{background:#fdecea;color:var(--danger);border:1px solid #f6cbc6;}
.msg-success{background:#e7f8ef;color:var(--success);border:1px solid #b9e8cf;}
.msg-info{background:#eef0fb;color:var(--purple);border:1px solid #d8d3f5;}
.center{text-align:center;}
.login-wrap{max-width:420px;margin:60px auto 0;}
.logo-big{width:86px;height:86px;margin:0 auto 14px;display:block;}
.session-row{display:grid;grid-template-columns:36px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px;}
.session-num{
  width:30px;height:30px;border-radius:50%;background:var(--purple);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
}
canvas.sigpad{
  border:1.5px dashed var(--line);border-radius:10px;width:100%;height:150px;
  touch-action:none;background:#fff;
}
.link-btn{background:none;border:none;color:var(--purple);text-decoration:underline;cursor:pointer;font-family:inherit;font-size:13px;padding:0;}
.spinner{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:40px 20px;color:var(--muted);}
/* ---- Card (printable treatment card) ---- */
.pt-card{
  width:900px;max-width:100%;background:#fff;border-radius:16px;overflow:hidden;
  border:1px solid var(--line);margin:0 auto;
}
.pt-card-head{
  background:linear-gradient(135deg,var(--purple) 0%,var(--purple-dark) 100%);
  color:#fff;padding:20px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.pt-card-head .logo-mark{
  width:52px;height:52px;border-radius:12px;background:#fff;
  flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:3px;
}
.pt-card-head .logo-mark img{width:100%;height:100%;object-fit:contain;display:block;}
.pt-card-head h2{color:#fff;margin:0;font-size:18px;}
.pt-card-head .sub{color:var(--gold-light);font-size:12px;margin-top:2px;}
.pt-card-body{padding:22px 26px;}
.pt-info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px 20px;margin-bottom:18px;}
.pt-info-grid .it .k{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}
.pt-info-grid .it .v{font-size:14px;font-weight:700;color:var(--ink);}
.pt-card-body table{margin-bottom:16px;}
.pt-card-body th{font-size:11.5px;}
.pt-sig-box{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-top:10px;}
.terms-box{
  background:#faf9fd;border:1.5px solid var(--line);border-radius:10px;
  padding:14px 16px;margin-top:6px;
}
.terms-box .terms-title{font-weight:800;color:var(--purple-dark);font-size:13px;margin-bottom:6px;}
.terms-box .terms-text{font-size:12.5px;color:var(--ink);line-height:1.9;white-space:pre-line;}
.pt-sig-box .sig-img{border-bottom:1.5px solid var(--ink);height:70px;display:flex;align-items:flex-end;justify-content:center;min-width:220px;}
.pt-sig-box .sig-img img{max-height:65px;}
.pt-sig-label{font-size:11.5px;color:var(--muted);margin-top:4px;text-align:center;}
.pt-card-foot{
  background:#f3f0fb;padding:12px 26px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;
  font-size:11.5px;color:var(--purple-dark);font-weight:600;
}
.status-done{color:var(--success);font-weight:700;}
.status-pending{color:#b3860b;font-weight:700;}
.status-empty{color:#bbb;}
::placeholder{color:#b8b3cc;}
</style>
</head>

  const newUrl = location.pathname + (p.toString() ? '?' + p.toString() : '');

}

/* ======================= API HELPER ======================= */
async function api(action, params, method){
  method = method || 'GET';
  if(!STATE.apiUrl) throw new Error('no api url');
  if(method === 'GET'){
    const url = new URL(STATE.apiUrl);
    url.searchParams.set('action', action);
    Object.keys(params||{}).forEach(k => { if(params[k]!==undefined && params[k]!==null) url.searchParams.set(k, params[k]); });
    const res = await fetch(url.toString(), {method:'GET'});
    return res.json();
  } else {
    const body = Object.assign({action}, params||{});
    const res = await fetch(STATE.apiUrl, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(body)
    });
    return res.json();
  }
}

// جلسة قد تُخزَّن كـ "YYYY-MM-DD HH:MM" أو مع لاحقة "|done" لو تم تأكيدها يدويًا بغض النظر عن التاريخ
function parseSessionCell(raw){
  raw = raw || '';
  const parts = String(raw).split('|');
  return { display: parts[0] || '', manualDone: parts[1] === 'done' };
}
function sessionIsDone(raw){
  const parsed = parseSessionCell(raw);
  if(!parsed.display) return false;
  if(parsed.manualDone) return true;
  const d = new Date(parsed.display.replace(' ', 'T'));
  if(isNaN(d)) return false;
  return d < new Date();
}

function renderCurrentPatientSection(){
  if(!STATE.currentPatient) return '';
  return STATE.editMode ? renderEditPatientForm(STATE.currentPatient) : renderPatientCardSection(STATE.currentPatient, true);
}

function renderEditPatientForm(p){
  const L = t(); const c = cfg();
  const insurance = c.insuranceList || [];

    const raw = p['Session'+i] || '';
    const parsed = parseSessionCell(raw);
    const dateVal = parsed.display ? parsed.display.split(' ')[0] : '';
    const timeVal = parsed.display && parsed.display.split(' ')[1] ? parsed.display.split(' ')[1] : '';
    sessionsHtml += `
    <div class="session-row" style="grid-template-columns:36px 1fr 1fr auto;">

      <input type="date" id="editSessDate${i}" value="${esc(dateVal)}">

      <label style="display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;white-space:nowrap;color:var(--purple-dark);">
        <input type="checkbox" id="editSessDone${i}" ${(parsed.manualDone || parsed.display) ? 'checked' : ''} style="width:auto;margin:0;">
        ${esc(L.confirmManually)}
      </label>
    </div>`;
  }
  return `
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:6px;">
      <h2 style="margin:0;">${esc(L.editPatientTitle)}</h2>

function esc(s){
  if(s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function msgBox(){
  if(!STATE.message) return '';
  const cls = STATE.message.type === 'error' ? 'msg-error' : (STATE.message.type === 'success' ? 'msg-success' : 'msg-info');
  return `<div class="msg ${cls}">${esc(STATE.message.text)}</div>`;
}
function spinner(){ return `<span class="spinner"></span>`; }
function setMsg(type, text){ STATE.message = {type, text}; }
function clearMsg(){ STATE.message = null; }

/* ======================= SIGNATURE PAD ======================= */
const SIG_PADS = {}; // canvasId -> {ctx, drawing, last, drawn}
function initSigPadById(canvasId){
  const canvas = document.getElementById(canvasId);
  if(!canvas) return;
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * ratio;
  canvas.height = canvas.clientHeight * ratio;
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  ctx.strokeStyle = '#231b3a';
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  const state = { ctx, drawing: false, last: null, drawn: false };
  SIG_PADS[canvasId] = state;

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
    return {x: cx, y: cy};
  }
  function start(e){ e.preventDefault(); state.drawing = true; state.last = pos(e); }
  function move(e){
    if(!state.drawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.beginPath();
    ctx.moveTo(state.last.x, state.last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    state.last = p;
    state.drawn = true;
  }
  function end(){ state.drawing = false; }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}
function clearSigPadById(canvasId){
  const canvas = document.getElementById(canvasId);
  const state = SIG_PADS[canvasId];
  if(!canvas || !state) return;
  state.ctx.clearRect(0, 0, canvas.width, canvas.height);
  state.drawn = false;
}
function getSigDataUrlById(canvasId){
  const canvas = document.getElementById(canvasId);
  const state = SIG_PADS[canvasId];
  if(!canvas || !state || !state.drawn) return '';
  return canvas.toDataURL('image/png');
}
// أسماء متوافقة مع الكود القديم لفورم تسجيل مريض جديد (canvas id="sigPad")
function initSigPad(){ initSigPadById('sigPad'); }
function clearSigPad(){ clearSigPadById('sigPad'); }
function getSigDataUrl(){ return getSigDataUrlById('sigPad'); }

async function onSavePatient(){

  }

    FileNumber: file,

    Doctor: document.getElementById('pDoctor').value.trim(),
    Treatment: document.getElementById('pTreatment').value.trim(),
    NurseName: document.getElementById('pNurse').value.trim(),

    Sessions: sessions,

  };

  STATE.loading = true; clearMsg(); render();
  try{
    const res = await api('addPatient', {patient, registeredBy: STATE.user.username}, 'POST');
    STATE.loading = false;
    if(res.success){
      setMsg('success', t().savedOk);
      const full = Object.assign({}, patient, {PatientID: res.patientId, RegistrationDate: new Date().toISOString().slice(0,16).replace('T',' ')});
      full.Session1=sessions[0]; full.Session2=sessions[1]; full.Session3=sessions[2]; full.Session4=sessions[3];
      full.Session5=sessions[4]; full.Session6=sessions[5]; full.Session7=sessions[6]; full.Session8=sessions[7];
      full.Session9=sessions[8]; full.Session10=sessions[9]; full.Session11=sessions[10]; full.Session12=sessions[11];
      STATE.currentPatient = full;
      STATE.editMode = false;
    } else {
      setMsg('error', res.message);
    }
  } catch(err){ STATE.loading = false; setMsg('error', t().connError); }
  render();
}

async function onSaveEditPatient(){
  const L = t();
  if(!STATE.currentPatient || !STATE.currentPatient.PatientID){ setMsg('error', t().connError); render(); return; }
  const name = document.getElementById('editName').value.trim();
  const file = document.getElementById('editFile').value.trim();
  if(!name || !file){ setMsg('error', L.requiredFields); render(); return; }

  const sessions = [];
  for(let i=1;i<=12;i++){
    const d = document.getElementById('editSessDate'+i).value;
    const tm = document.getElementById('editSessTime'+i).value;
    const done = document.getElementById('editSessDone'+i).checked;
    let val = d ? (d + (tm ? ' ' + tm : '')) : '';
    if(val && done) val += '|done';
    sessions.push(val);
  }

  const patient = {
    PatientName: name,
    FileNumber: file,
    InsuranceCompany: document.getElementById('editInsurance').value,
    NationalID: document.getElementById('editNationalId').value.trim(),
    Mobile: document.getElementById('editMobile').value.trim(),
    Doctor: document.getElementById('editDoctor').value.trim(),
    Treatment: document.getElementById('editTreatment').value.trim(),
    NurseName: document.getElementById('editNurse').value.trim(),
    Notes: document.getElementById('editNotes').value.trim(),
    Sessions: sessions
  };
  const newSig = getSigDataUrlById('editSigPad');
  if(newSig) patient.SignatureDataURL = newSig;

  STATE.loading = true; clearMsg(); render();
  try{
    const res = await api('updatePatient', {patientId: STATE.currentPatient.PatientID, patient, updatedBy: STATE.user.username}, 'POST');
    STATE.loading = false;
    if(res.success){
      const updated = Object.assign({}, STATE.currentPatient, patient);
      for(let i=1;i<=12;i++){ updated['Session'+i] = sessions[i-1]; }
      STATE.currentPatient = updated;
      STATE.editMode = false;
      setMsg('success', t().updatedOk);
      // حدّث النتيجة المطابقة في قائمة نتائج البحث الحالية أيضاً لو موجودة
      STATE.patients = STATE.patients.map(p => p.PatientID === updated.PatientID ? Object.assign({}, p, patient) : p);
    } else {
      setMsg('error', res.message);
    }
  } catch(err){ STATE.loading = false; setMsg('error', t().connError); }
  render();
}

// يفلتر فورًا من الفهرس المحمّل مسبقًا في المتصفح، من غير أي نداء شبكة، فالنتيجة تظهر لحظيًا
function applySearchFilter(){
  const q = STATE.searchQuery.trim().toLowerCase();
  const source = STATE.patientsIndex;
  if(!q){
    STATE.patients = source.slice(-50).reverse();
  } else {
    STATE.patients = source.filter(p =>
      String(p.PatientName||'').toLowerCase().includes(q) ||
      String(p.FileNumber||'').toLowerCase().includes(q) ||
      String(p.NationalID||'').toLowerCase().includes(q) ||
      String(p.Mobile||'').toLowerCase().includes(q) ||
      String(p.PatientID||'').toLowerCase().includes(q)
    ).reverse();
  }
  render();
}

// يحمّل/يحدّث فهرس المرضى الكامل في الخلفية. force=true يتجاوز فحص الصلاحية الزمنية (3 دقائق)
async function loadPatientsIndex(force){
  const stale = !STATE.patientsIndexTs || (Date.now() - STATE.patientsIndexTs > SEARCH_REFRESH_MS);
  if(!force && !stale) return;
  if(STATE.patientsIndexLoading) return;
  STATE.patientsIndexLoading = true;
  if(STATE.tab === 'search') render();
  try{
    const res = await api('listPatients', {}, 'GET');
    if(res.success){
      STATE.patientsIndex = res.patients;
      STATE.patientsIndexTs = Date.now();
    }
  } catch(err){ /* تحديث صامت، تفضل البيانات المخزّنة سابقًا كما هي لو فشل */ }
  STATE.patientsIndexLoading = false;
  if(STATE.tab === 'search'){ applySearchFilter(); }

/* ======================= CARD CANVAS RENDERER (native, correct Arabic shaping) ======================= */
function loadImage(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}
// Truncates text with an ellipsis so it fits maxWidth. Uses native fillText/measureText,
// so Arabic joining/shaping is handled correctly by the browser (unlike html2canvas).
function truncateToWidth(ctx, text, maxWidth){
  text = String(text == null ? '' : text);
  if(ctx.measureText(text).width <= maxWidth) return text;
  let lo = 0, hi = text.length;
  while(lo < hi){
    const mid = Math.ceil((lo+hi)/2);
    const candidate = text.slice(0, mid) + '…';
    if(ctx.measureText(candidate).width <= maxWidth) lo = mid; else hi = mid - 1;
  }
  return text.slice(0, lo) + '…';
}
// يقسّم نص (ممكن يحتوي على \n لفقرات متعددة) لأسطر تناسب عرض معيّن، بالاعتماد على measureText الأصلية
// فبيحترم تشكيل الحروف العربية صح لأنه بيقيس كلمات كاملة مش حروف منفردة
function wrapTextToLines(ctx, text, maxWidth){
  const paragraphs = String(text == null ? '' : text).split('\n');
  const lines = [];
  paragraphs.forEach(para => {
    const words = para.split(' ');
    let current = '';
    words.forEach(word => {
      const test = current ? current + ' ' + word : word;
      if(ctx.measureText(test).width <= maxWidth || !current){
        current = test;
      } else {
        lines.push(current);
        current = word;
      }
    });
    if(current) lines.push(current);
  });
  return lines;
}
function formatSessionValue(val){
  // يستخدم نفس منطق تفسير الجلسة (يستبعد لاحقة |done الخاصة بالتأكيد اليدوي) الموجود في parseSessionCell
  return parseSessionCell(val).display;
}

async function renderCardToCanvas(patient){
  const L = t(); const c = cfg();
  const isAr = STATE.lang === 'ar';
  const scale = 2;
  const W = 900;
  const PAD = 26;
  const HEADER_H = 108;
  const ROW_H = 44;
  const INFO_ROWS = 3, INFO_COLS = 3;
  const INFO_GRID_H = INFO_ROWS * ROW_H + 6;
  const TABLE_HEADER_H = 32;
  const TABLE_ROW_H = 30;
  const bookedSessionNumbers = [];
  for(let s = 1; s <= 12; s++){
    if(parseSessionCell(patient['Session' + s]).display) bookedSessionNumbers.push(s);
  }
  const sessionRowCount = Math.max(bookedSessionNumbers.length, 1); // صف واحد على الأقل لعرض رسالة "لا توجد جلسات" لو مفيش حجوزات
  const TABLE_H = TABLE_HEADER_H + sessionRowCount * TABLE_ROW_H;
  const SIG_H = 118;
  const FOOTER_H = 50;
  const FONT = "'Cairo','Tahoma',sans-serif";

  try{ if(document.fonts && document.fonts.ready) await document.fonts.ready; }catch(e){}

  // نقيس نص الشروط والأحكام مسبقًا (بخط مؤقت) عشان نحدد ارتفاع صندوقه قبل ما نجهّز حجم الكانفاس النهائي
  const measureCanvas = document.createElement('canvas');
  const mctx = measureCanvas.getContext('2d');
  mctx.font = "400 12px " + FONT;
  const TERMS_PAD = 14;
  const TERMS_TITLE_H = 20;
  const TERMS_LINE_H = 19;
  const termsMaxWidth = W - PAD*2 - TERMS_PAD*2;
  const termsLines = wrapTextToLines(mctx, L.termsText, termsMaxWidth);
  const TERMS_H = TERMS_PAD*2 + TERMS_TITLE_H + termsLines.length * TERMS_LINE_H;

  const bodyTop = HEADER_H + PAD;
  const infoGridTop = bodyTop;
  const tableTop = infoGridTop + INFO_GRID_H + 18;
  const termsTop = tableTop + TABLE_H + 18;
  const sigTop = termsTop + TERMS_H + 18;
  const H = sigTop + SIG_H + PAD + FOOTER_H;

  const canvas = document.createElement('canvas');
  canvas.width = Math.ceil(W * scale);
  canvas.height = Math.ceil(H * scale);
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);
  ctx.direction = isAr ? 'rtl' : 'ltr';
  ctx.textBaseline = 'alphabetic';

  const COL = {
    purple: '#3b1f6e', purpleDark: '#28154d', gold: '#b9a227', goldLight: '#e6d97a',
    ink: '#231b3a', muted: '#736c8a', line: '#e6e2f2', footBg: '#f3f0fb',
    success: '#1e8a5f', pending: '#b3860b', empty: '#bbbbbb'
  };

  // ---- background ----
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  // ---- header ----
  const grad = ctx.createLinearGradient(0, 0, W, HEADER_H);
  grad.addColorStop(0, COL.purple);
  grad.addColorStop(1, COL.purpleDark);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, HEADER_H);

  const logoSize = 54;
  const logoX = isAr ? PAD : (W - PAD - logoSize);
  const logoY = (HEADER_H - logoSize) / 2;
  roundRectPath(ctx, logoX, logoY, logoSize, logoSize, 12);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
  try{
    const logoImg = await loadImage(LOGO_ICON);
    ctx.drawImage(logoImg, logoX + 5, logoY + 5, logoSize - 10, logoSize - 10);
  }catch(e){}

  const clinicName = isAr ? (c.clinicNameAr || '') : (c.clinicNameEn || '');
  ctx.fillStyle = '#ffffff';
  ctx.font = "700 19px " + FONT;
  ctx.textAlign = isAr ? 'right' : 'left';
  const textEdgeX = isAr ? (W - PAD) : PAD;
  ctx.fillText(truncateToWidth(ctx, clinicName, W - PAD*2 - logoSize - 20), textEdgeX, HEADER_H/2 - 4);
  ctx.fillStyle = COL.goldLight;
  ctx.font = "600 12.5px " + FONT;
  ctx.fillText(L.patientCard, textEdgeX, HEADER_H/2 + 18);

  // ---- info grid ----
  const items = [
    [L.patientName, patient.PatientName],
    [L.fileNumber, patient.FileNumber],
    [L.insuranceCompany, patient.InsuranceCompany || '-'],
    [L.nationalId, patient.NationalID || '-'],
    [L.mobile, patient.Mobile || '-'],
    [L.doctor, patient.Doctor || '-'],
    [L.nurseName, patient.NurseName || '-'],
    [L.regDate, patient.RegistrationDate || '-'],
    [L.treatment, patient.Treatment || '-']
  ];
  const colW = (W - PAD*2) / INFO_COLS;
  const cellInnerPad = 4;
  for(let idx = 0; idx < items.length; idx++){
    const rowIdx = Math.floor(idx / INFO_COLS);
    const dataCol = idx % INFO_COLS;
    const physCol = isAr ? (INFO_COLS - 1 - dataCol) : dataCol;
    const colLeft = PAD + physCol * colW;
    const rowTop = infoGridTop + rowIdx * ROW_H;
    const align = isAr ? 'right' : 'left';
    const anchorX = isAr ? (colLeft + colW - cellInnerPad) : (colLeft + cellInnerPad);
    ctx.textAlign = align;
    ctx.fillStyle = COL.muted;
    ctx.font = "700 10.5px " + FONT;
    ctx.fillText(truncateToWidth(ctx, items[idx][0], colW - cellInnerPad*2), anchorX, rowTop + 13);
    ctx.fillStyle = COL.ink;
    ctx.font = "700 14px " + FONT;
    ctx.fillText(truncateToWidth(ctx, items[idx][1], colW - cellInnerPad*2), anchorX, rowTop + 32);
  }

  // ---- sessions table ----
  const SESS_W = 60, STATUS_W = 90, SIG_W = 90;
  const DATE_W = (W - PAD*2) - SESS_W - STATUS_W - SIG_W;
  // physical left-to-right order
  let colsPhys; // [{key,width}]
  if(isAr){
    colsPhys = [{key:'status', w:STATUS_W}, {key:'signature', w:SIG_W}, {key:'date', w:DATE_W}, {key:'session', w:SESS_W}];
  } else {
    colsPhys = [{key:'session', w:SESS_W}, {key:'date', w:DATE_W}, {key:'signature', w:SIG_W}, {key:'status', w:STATUS_W}];
  }
  const colX = [];
  { let x = PAD; for(const col of colsPhys){ colX.push(x); x += col.w; } }

  // نحمّل صورة توقيع المريض مرة واحدة مقدّمًا (لو موجودة) عشان نرسمها في كل صف جلسة محجوزة
  let patientSigImg = null;
  if(patient.SignatureDataURL){
    try{ patientSigImg = await loadImage(patient.SignatureDataURL); }catch(e){}
  }

  // table header row
  ctx.fillStyle = COL.footBg;
  ctx.fillRect(PAD, tableTop, W - PAD*2, TABLE_HEADER_H);
  ctx.font = "700 11.5px " + FONT;
  ctx.fillStyle = COL.purpleDark;
  const headerLabel = { session: L.session, date: L.date + ' / ' + L.time, signature: L.signature, status: L.status };
  colsPhys.forEach((col, i) => {
    ctx.textAlign = 'center';
    ctx.fillText(truncateToWidth(ctx, headerLabel[col.key], col.w - 10), colX[i] + col.w/2, tableTop + 21);
  });

  // table rows
  if(bookedSessionNumbers.length === 0){
    const rowY = tableTop + TABLE_HEADER_H;
    ctx.strokeStyle = COL.line;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(PAD, rowY + TABLE_ROW_H);
    ctx.lineTo(W - PAD, rowY + TABLE_ROW_H);
    ctx.stroke();
    ctx.fillStyle = COL.empty;
    ctx.font = "400 12px " + FONT;
    ctx.textAlign = 'center';
    ctx.fillText(L.noSessionsBooked, W/2, rowY + TABLE_ROW_H/2 + 4);
  }
  bookedSessionNumbers.forEach((s, idx) => {
    const rowY = tableTop + TABLE_HEADER_H + idx * TABLE_ROW_H;
    // bottom border
    ctx.strokeStyle = COL.line;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(PAD, rowY + TABLE_ROW_H);
    ctx.lineTo(W - PAD, rowY + TABLE_ROW_H);
    ctx.stroke();

    const rawVal = patient['Session' + s] || '';
    const val = formatSessionValue(rawVal);
    const textY = rowY + TABLE_ROW_H/2 + 4;

    colsPhys.forEach((col, i) => {
      ctx.textAlign = 'center';
      const cx = colX[i] + col.w/2;
      if(col.key === 'session'){
        ctx.fillStyle = COL.ink;
        ctx.font = "700 12.5px " + FONT;
        ctx.fillText(String(s), cx, textY);
      } else if(col.key === 'date'){
        ctx.fillStyle = val ? COL.ink : COL.empty;
        ctx.font = "400 12px " + FONT;
        ctx.fillText(truncateToWidth(ctx, val || '-', col.w - 12), cx, textY);
      } else if(col.key === 'signature'){
        if(patientSigImg){
          const maxH = 22, maxW = col.w - 14;
          let dw = patientSigImg.width, dh = patientSigImg.height;
          const ratio = Math.min(maxW/dw, maxH/dh);
          dw *= ratio; dh *= ratio;
          ctx.drawImage(patientSigImg, cx - dw/2, textY - dh + 5, dw, dh);
        }
      } else if(col.key === 'status'){
        if(!val){
          ctx.fillStyle = COL.empty;
          ctx.font = "400 11.5px " + FONT;
          ctx.fillText(truncateToWidth(ctx, L.notScheduled, col.w - 10), cx, textY);
        } else if(sessionIsDone(rawVal)){
          ctx.fillStyle = COL.success;
          ctx.font = "700 14px " + FONT;
          ctx.fillText('✓', cx, textY);
        } else {
          ctx.fillStyle = COL.pending;
          ctx.font = "700 16px " + FONT;
          ctx.fillText('•', cx, textY);
        }
      }
    });
  });

  // ---- terms & conditions ----
  ctx.fillStyle = '#faf9fd';
  ctx.strokeStyle = COL.line;
  ctx.lineWidth = 1.5;
  roundRectPath(ctx, PAD, termsTop, W - PAD*2, TERMS_H, 10);
  ctx.fill();
  ctx.stroke();
  ctx.textAlign = isAr ? 'right' : 'left';
  const termsTextX = isAr ? (W - PAD - TERMS_PAD) : (PAD + TERMS_PAD);
  ctx.fillStyle = COL.purpleDark;
  ctx.font = "800 13px " + FONT;
  ctx.fillText(L.termsTitle, termsTextX, termsTop + TERMS_PAD + 12);
  ctx.fillStyle = COL.ink;
  ctx.font = "400 12px " + FONT;
  termsLines.forEach((line, i) => {
    ctx.fillText(line, termsTextX, termsTop + TERMS_PAD + TERMS_TITLE_H + 12 + i * TERMS_LINE_H);
  });

  // ---- signatures: patient + treating doctor ----
  const boxW = 230;
  const patientBoxX = isAr ? (W - PAD - boxW) : PAD;
  const doctorBoxX = isAr ? PAD : (W - PAD - boxW);
  const sigLineY = sigTop + 78;

  async function drawSigBox(boxX, imgSrc, label){
    if(imgSrc){
      try{
        const img = await loadImage(imgSrc);
        const maxH = 70, maxW = boxW - 10;
        let dw = img.width, dh = img.height;
        const ratio = Math.min(maxW/dw, maxH/dh);
        dw *= ratio; dh *= ratio;
        ctx.drawImage(img, boxX + (boxW-dw)/2, sigLineY - dh, dw, dh);
      }catch(e){}
    }
    ctx.strokeStyle = COL.ink;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(boxX, sigLineY);
    ctx.lineTo(boxX + boxW, sigLineY);
    ctx.stroke();
    ctx.fillStyle = COL.muted;
    ctx.font = "600 11.5px " + FONT;
    ctx.textAlign = 'center';
    ctx.fillText(label, boxX + boxW/2, sigLineY + 18);
  }

  await drawSigBox(patientBoxX, patient.SignatureDataURL, L.signature);
  await drawSigBox(doctorBoxX, DOCTOR_STAMP, L.doctorSignature);

  // ---- footer ----
  const footTop = H - FOOTER_H;
  ctx.fillStyle = COL.footBg;
  ctx.fillRect(0, footTop, W, FOOTER_H);
  ctx.font = "700 11.5px " + FONT;
  ctx.fillStyle = COL.purpleDark;
  const addressTxt = L.address + ': ' + (c.address || '');
  const phoneTxt = L.phone + ': ' + (c.phone || '');
  if(isAr){
    ctx.textAlign = 'right';
    ctx.fillText(truncateToWidth(ctx, addressTxt, W/2 - PAD - 10), W - PAD, footTop + FOOTER_H/2 + 4);
    ctx.textAlign = 'left';
    ctx.fillText(truncateToWidth(ctx, phoneTxt, W/2 - PAD - 10), PAD, footTop + FOOTER_H/2 + 4);
  } else {
    ctx.textAlign = 'left';
    ctx.fillText(truncateToWidth(ctx, addressTxt, W/2 - PAD - 10), PAD, footTop + FOOTER_H/2 + 4);
    ctx.textAlign = 'right';
    ctx.fillText(truncateToWidth(ctx, phoneTxt, W/2 - PAD - 10), W - PAD, footTop + FOOTER_H/2 + 4);
  }

  return canvas;
}

async function onDownloadCard(){
  if(!STATE.currentPatient) return;
  const btn = document.getElementById('btnDownloadCard');
  if(btn) btn.disabled = true;
  try{
    const canvas = await renderCardToCanvas(STATE.currentPatient);
    const link = document.createElement('a');
    link.download = 'PT_Card_' + (STATE.currentPatient.FileNumber || 'patient') + '.jpg';
    link.href = canvas.toDataURL('image/jpeg', 0.95);
    link.click();
  } catch(err){
    setMsg('error', t().connError);
    render();
  }
  if(btn) btn.disabled = false;
}

function onPrintCard(){
  const node = document.getElementById('ptCard');
  if(!node) return;
  const clone = node.cloneNode(true);
  clone.querySelectorAll('tr[data-has-date="0"]').forEach(tr => tr.remove());
  const w = window.open('', '_blank');
  w.document.write('<html><head><title>Print</title>' + document.querySelector('style').outerHTML + '</head><body style="padding:20px;">' + clone.outerHTML + '</body></html>');
  w.document.close();
  setTimeout(() => w.print(), 300);
}

async function onChangePassword(){
  const newPw = document.getElementById('newPw').value;
  if(newPw.length < 6){ setMsg('error', t().requiredFields); render(); return; }
  STATE.loading = true; clearMsg(); render();
  try{
    const res = await api('changePassword', {username: STATE.user.username, newPassword: newPw}, 'POST');
    STATE.loading = false;
    if(res.success) setMsg('success', t().pwChanged); else setMsg('error', res.message);
  } catch(err){ STATE.loading = false; setMsg('error', t().connError); }
  render();
}
